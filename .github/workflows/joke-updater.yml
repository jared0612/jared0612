name: 🎭 Update Joke Every 10 Minutes

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-joke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node joke-generator.js
      - run: |
          git config user.name "Joke Bot"
          git config user.email "bot@github.com"
          git add README.md
          git diff --quiet || (git commit -m "🎭 自动更新笑话" && git push)
